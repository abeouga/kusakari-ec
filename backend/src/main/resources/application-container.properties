# Opt-in, private preview only. These settings are not loaded by Windows start.bat.
server.address=0.0.0.0
spring.datasource.url=${KUSAKARI_EC_DB_URL}
spring.datasource.hikari.maximum-pool-size=${KUSAKARI_EC_DB_POOL_SIZE:8}
spring.datasource.hikari.data-source-properties.sslMode=${KUSAKARI_EC_DB_SSL_MODE:VERIFY_IDENTITY}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${KUSAKARI_EC_DB_TRUSTSTORE_URL:file:/app/certs/rds.p12}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=changeit
spring.datasource.hikari.data-source-properties.connectTimeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=30000
# Run the explicit migration command before launching application tasks.
spring.flyway.enabled=false
kusakari.ec.container=true
kusakari.ec.secure-cookie=${KUSAKARI_EC_SECURE_COOKIE:true}
kusakari.ec.web-origin=${KUSAKARI_PUBLIC_ORIGIN}
kusakari.ec.canvas-origin=${KUSAKARI_PUBLIC_ORIGIN}
kusakari.ec.canvas-api-url=${KUSAKARI_CANVAS_API_URL:http://127.0.0.1:8080/canvas}
