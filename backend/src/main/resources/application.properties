spring.application.name=kusakari-ec-api
server.address=127.0.0.1
server.port=${KUSAKARI_EC_API_PORT:8086}
spring.datasource.url=${KUSAKARI_EC_DB_URL:jdbc:mysql://127.0.0.1:3306/kusakari?connectionTimeZone=UTC}
spring.datasource.username=${KUSAKARI_EC_DB_USER}
spring.datasource.password=${KUSAKARI_EC_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
kusakari.ec.web-origin=${KUSAKARI_EC_WEB_ORIGIN:http://127.0.0.1:5186}

kusakari.ec.canvas-origin=${KUSAKARI_EC_CANVAS_ORIGIN:http://127.0.0.1:5173}
