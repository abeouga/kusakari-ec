spring.application.name=kusakari-ec-api
kusakari.ec.openai-api-key=${KUSAKARI_EC_OPENAI_API_KEY:}
kusakari.ec.plant-suggestion-model=${KUSAKARI_EC_PLANT_SUGGESTION_MODEL:gpt-6-luna}
server.address=127.0.0.1
server.port=${KUSAKARI_EC_API_PORT:8086}
spring.datasource.url=${KUSAKARI_EC_DB_URL:jdbc:mysql://127.0.0.1:3306/kusakari?connectionTimeZone=UTC}
spring.datasource.username=${KUSAKARI_EC_DB_USER}
spring.datasource.password=${KUSAKARI_EC_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
kusakari.ec.web-origin=${KUSAKARI_EC_WEB_ORIGIN:http://127.0.0.1:5186}

kusakari.ec.canvas-origin=${KUSAKARI_EC_CANVAS_ORIGIN:http://127.0.0.1:5173}
kusakari.ec.canvas-api-url=${KUSAKARI_CANVAS_API_URL:http://127.0.0.1:8080}
kusakari.ec.container=false
kusakari.ec.secure-cookie=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
