kusakari.auth.mode=cognito
spring.security.oauth2.client.registration.cognito.provider=cognito
spring.security.oauth2.client.registration.cognito.client-id=${KUSAKARI_COGNITO_CLIENT_ID}
spring.security.oauth2.client.registration.cognito.client-authentication-method=none
spring.security.oauth2.client.registration.cognito.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.cognito.redirect-uri=${kusakari.ec.web-origin}/api/auth/callback/cognito
spring.security.oauth2.client.registration.cognito.scope=openid,email,profile
spring.security.oauth2.client.provider.cognito.issuer-uri=${KUSAKARI_COGNITO_ISSUER}
server.servlet.session.cookie.name=KUSAKARI_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${kusakari.ec.secure-cookie}
server.servlet.session.timeout=30m
