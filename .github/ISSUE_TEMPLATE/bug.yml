name: Bug
description: 不具合や想定外の動作を報告する
title: "[Bug] "
labels:
  - Bug

body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: |
        何ができるようになるかを「〜できるようにする」の 1 文で書きます。
        なぜ要るか・前提・根拠のリンクは、要るときだけ 1 行空けて「>」で 1〜2 文の注釈にします。
        完了条件は PR に書きます。クラス名・ファイル名を並べたり、「〜は変えない」と断ったりしません。
    validations:
      required: true

  - type: textarea
    id: decisions
    attributes:
      label: 決めること
      description: 決まっていないことがあるときだけ書きます。番号付きのチェックボックスで並べ、決まったら [x] にしてどう決まったかを 1 行添えます。
      placeholder: |
        - [ ] 1. 
        - [ ] 2. 
