name: Plan / 仕様決定
description: 実装の前に、仕様・設計・方針を決める（コードは書かない）
title: "[Plan] "
labels:
  - Plan

body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: |
        何ができるようになるかを「〜できるようにする」の 1 文で書きます。
        なぜ要るか・前提・根拠のリンクは、要るときだけ 1 行空けて「>」で 1〜2 文の注釈にします。
        完了条件は書きません。クラス名・ファイル名を並べたり、「〜は変えない」と断ったりしません。
    validations:
      required: true

  - type: textarea
    id: decisions
    attributes:
      label: 決めること
      description: 決める項目を、番号を振ったチェックリストで記載してください。番号は一度振ったら振り直さず、項目を足すときは続きの番号にしてください。決まったら [x] にして、どう決まったかと理由を1行添えてください。すべて [x] になったらCloseします。docs/ への記録や実装のIssueの作成など、Closeする前にしておく作業もここに入れてください。
      value: |
        - [ ] 1.
        - [ ] 2.
        - [ ] 3. 決定を `docs/` に記録する
        - [ ] 4. 実装のIssueを作る
    validations:
      required: true
