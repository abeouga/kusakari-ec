name: Plan / 仕様決定
description: 実装の前に、仕様・設計・方針を決める（コードは書かない）
title: "[Plan] "
labels:
  - Plan

body:
  - type: textarea
    id: purpose
    attributes:
      label: 決めることでできるようになること
      description: このIssueで決めると、何ができるようになるのかを記載してください。何を決めるのかは「決めること」に書きます。
      placeholder: 例）組織・店舗・メンバーのテーブル構成が決まり、マイグレーションと認可の実装に入れるようになる
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 現在の課題
      description: 今どのような課題があり、なぜ決める必要があるのかを記載してください。前のIssueで決まったことは書き写さず、「前提のIssue」にリンクを置いてください。
      placeholder: |
        例）
        - 1つのアカウントで1つの店舗しか扱えない
        - 組織やロールの階層を表す仕組みがない

  - type: textarea
    id: decisions
    attributes:
      label: 決めること
      description: 決める項目をチェックリストで記載してください。決まったら [x] にして、どう決まったかと理由を1行添えてください。
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: premises
    attributes:
      label: 前提のIssue
      description: すでに決まっていて、このIssueでは変えないことを決めたIssueへのリンクを記載してください。決まった内容は書き写さず、何を決めたIssueかだけを添えてください。親Issueと同じ前提でも、親Issueの本文を繰り返さず、リンクだけを置いてください。
      placeholder: |
        例）
        - #181：オーナーの譲渡の基本の仕様
        - #102：オーナーは1つの組織に1人

  - type: textarea
    id: options
    attributes:
      label: 案と比較
      description: 検討している案と、それぞれの良い点・問題点を記載してください。採用しなかった案は理由とともに残してください。
      placeholder: |
        例）
        - 案A：商品の所有者を組織にする。1回の登録で複数店舗で売れるが、価格の変更がほかの店舗にも効く
        - 案B：商品の所有者を店舗にする。店舗ごとに登録し直す必要がある

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: このIssueをCloseできる条件を記載してください。
      value: |
        - 「決めること」がすべて決まっている
        - 決定を `docs/` に記録している
        - 実装のIssueを作成している
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 関連するIssue・資料
      description: 親Issue、実装のIssue、関連する設計資料などを記載してください。「前提のIssue」に書いたIssueは、ここに重ねて書かないでください。
      placeholder: 例）親issue：#103、実装：#107、#108
